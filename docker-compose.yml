# Runs the WHOLE application with one command:  docker compose up --build
# Three separate containers: frontend (Nginx + React), backend (FastAPI), db (PostgreSQL).
# The frontend's Nginx also acts as a reverse proxy (bonus): it serves the site
# and forwards /api + /uploads to the backend, so the browser only talks to one origin.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/campus
      JWT_SECRET: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      ADMIN_EMAIL: admin@campus.edu
      ADMIN_PASSWORD: admin123
      ADMIN_NAME: Portal Admin
      CORS_ORIGINS: "http://localhost,http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    # Exposed so you can still open Swagger directly at localhost:8000/api/docs
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    # The whole app is served here — open http://localhost
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
