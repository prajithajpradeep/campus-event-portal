server {
    listen 80;
    server_name _;

    # Serve the built React single-page app.
    root /usr/share/nginx/html;
    index index.html;

    # Any unknown path falls back to index.html so React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend container (same-origin => no CORS).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Forward uploaded banner images to the backend.
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }
}
